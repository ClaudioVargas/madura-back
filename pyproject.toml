[project]
name = "madura-back"
version = "0.1.0"
description = "Backend del proyecto Madura: API de clasificación de madurez de plátanos con FastAPI, JWT y un modelo Keras (verde/madura/pasada)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "bcrypt>=5.0.0",
    "email-validator",
    "fastapi",
    "keras>=3.15.1",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pydantic",
    "pydantic-settings>=2.15.0",
    "python-jose",
    "python-multipart",
    "sqlalchemy",
    "tensorflow>=2.21.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# Depends/File/Query en defaults de argumentos es el patrón idiomático de FastAPI
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Form",
    "fastapi.security.OAuth2PasswordRequestForm",
    "app.security.deps.require_role",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
